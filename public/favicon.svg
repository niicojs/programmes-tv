<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- TV Body -->
  <rect x="14" y="32" width="100" height="70" rx="8" fill="#1e293b"/>
  <!-- Screen -->
  <rect x="22" y="40" width="84" height="54" rx="4" fill="url(#screen)"/>
  <!-- Screen shine -->
  <rect x="26" y="44" width="30" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
  <!-- Antenna left -->
  <line x1="44" y1="32" x2="28" y2="10" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Antenna right -->
  <line x1="84" y1="32" x2="100" y2="10" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Antenna tips -->
  <circle cx="28" cy="10" r="5" fill="#ef4444"/>
  <circle cx="100" cy="10" r="5" fill="#ef4444"/>
  <!-- Stand -->
  <rect x="48" y="102" width="32" height="6" rx="3" fill="#1e293b"/>
  <!-- Base -->
  <rect x="38" y="108" width="52" height="8" rx="4" fill="#334155"/>
</svg>
